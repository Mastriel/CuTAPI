kotlin.code.style=official
kotlinVersion=2.3.0
version=1.0.0
minecraftVersion=1.21.11
# The Kotlin compiler inherits this heap from the Gradle daemon. CuTAPI's
# Paperweight/NMS and DSL-heavy Kotlin sources exceed Gradle's small default
# heap during a full compile.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
