#
# Some plugins may prevent you from changing some of these values, so if a change isn't reflected in your server
# (after a restart!!!), then it is probably the fault of another plugin developer.
#



# This specifies the image used for the generated resource pack.
#
# Type: string
# Default: pack.png
pack-png: "pack.png"

# This is the name of the resource pack generated. This is always generated in plugins/CuTAPI/
#
# Type: string
# Default: pack.zip
generated-pack-name: "pack.zip"

# The description for the pack generated.
#
# Type: string
# Default: CuTAPI Generated Resource Pack
pack-description: "CuTAPI Generated Resource Pack"

# The formatter used for item origins (the tag in item lores which show where they come from). {} represents the name
# of the data source it came from. Set to "$DISABLE" to disable item origins from appearing.
#
# {small} represents the name of the item's data source written in sᴍᴀʟʟ ᴄᴀᴘs.
#
# Type: object
# Default: ->
#   default: "&9{}"
item-origin-formatter:
  default: "&9{}"

uploader:
  # The port for the internal server (if that's the uploader being used). You may need
  # to port-forward this port to make the server work
  #
  # Type: integer
  # Default: 32120
  port: 32120

  # The advertised host of the internal server (if that's the uploader being used).
  # 0.0.0.0 uses the same host each player used to connect to Minecraft. Set this
  # explicitly when the pack server is exposed through a different public host.
  #
  # Type: string
  # Default: 0.0.0.0 (which will automatically infer your IP)
  ip-address: 0.0.0.0

  # The ID of the uploader being used.
  # cutapi:internal is the default internal server for resource packs.
  #
  # Type: Identifier
  # Default: cutapi:internal
  id: cutapi:internal

asset-downloader:
  # The ID of the minecraft asset downloader being used.
  # cutapi:github downloads the assets from a mirror on GitHub.
  #
  # Type: Identifier
  # Default: cutapi:github
  id: cutapi:github
